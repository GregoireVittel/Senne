; Bike horn: ESP32-CAM -> Bluetooth speaker (A2DP), sounds from microSD
[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
; Classic Bluetooth + A2DP does not fit in the default 1.2 MB app partition
board_build.partitions = huge_app.csv
; Sounds are kept in the 4 MB PSRAM
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
